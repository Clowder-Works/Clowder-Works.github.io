<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Health — Clowder Works</title>
  <meta name="description" content="Clowder Works supports digital health research consortia with scientific integration, proposal development, and implementation support." />
  <script>(function(){var t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);})();</script>
  <link href="https://api.fontshare.com/v2/css?f[]=zodiak@400,500,700&f[]=general-sans@300,400,500,600&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>
  <main id="main">
    <!-- existing content preserved -->
    <div id="page-content-placeholder"></div>
  </main>
  <div id="site-footer"></div>
  <script src="nav-init.js" defer></script>
  <script>
    Promise.all([
      fetch('nav.html').then(r => r.text()),
      fetch('footer.html').then(r => r.text())
    ]).then(([navHTML, footerHTML]) => {
      document.getElementById('site-header').innerHTML = navHTML;
      document.getElementById('site-footer').innerHTML = footerHTML;
      initNav();
    });
  </script>
</body>
</html>
